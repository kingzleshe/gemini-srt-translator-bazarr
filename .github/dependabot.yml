version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    allow:
      - dependency-name: gemini-srt-translator
        dependency-type: direct
    open-pull-requests-limit: 1
    commit-message:
      prefix: deps
